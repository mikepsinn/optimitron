name: Longevitron

on:
  pull_request:
    paths:
      - 'longevitron/**'
      - '.github/workflows/longevitron.yml'
  push:
    branches: [main]
    paths:
      - 'longevitron/**'
      - '.github/workflows/longevitron.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: longevitron-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  evals:
    name: longevitron evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: longevitron
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@8.14.0 --activate

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: longevitron/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm eval
