name: Update PR branches

# Whenever main moves, refresh only open PRs labeled `auto-update`. This avoids
# rebuilding every active PR and every Vercel app after an unrelated merge.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-pr-branches
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Pushing the update as github-actions[bot] leaves every refreshed PR
      # with its checks stuck on "This workflow requires approval from a
      # maintainer". The bot is not a repository collaborator, so the
      # resulting `synchronize` event is treated as coming from an untrusted
      # actor and gated — even though the branches are the owner's own. On
      # 2026-07-26 one merge left 12 runs across 6 PRs sitting unapproved.
      #
      # Minting a short-lived GitHub App installation token fixes it at the
      # source: the push is attributed to an installed app with write access,
      # so the gate does not fire. Preferred over a personal access token
      # because it is scoped to this repo, expires in an hour, is revocable
      # by uninstalling the app, and is auditable as the app rather than as a
      # human who did not actually do it.
      #
      # Optional by design. Without PR_UPDATER_APP_ID set the step is skipped
      # and the run falls back to GITHUB_TOKEN, i.e. exactly today's
      # behaviour, so this file is safe to merge before the app exists.
      - name: Mint GitHub App token
        id: app_token
        if: ${{ vars.PR_UPDATER_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PR_UPDATER_APP_ID }}
          private-key: ${{ secrets.PR_UPDATER_APP_PRIVATE_KEY }}

      - name: Update open PR branches that are behind main
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          updated=""; skipped=""; failed=""
          # Compute behind-ness directly instead of trusting mergeStateStatus.
          # GitHub only reports mergeStateStatus=BEHIND when a PR is behind AND
          # otherwise mergeable; a behind PR with pending checks reports as
          # UNSTABLE/BLOCKED, which masks the behind-ness. Keying off the compare
          # API's behind_by catches every behind PR regardless of check/review
          # state — which is exactly the case a human ends up clicking by hand.
          repo_owner="${REPO%%/*}"
          if ! rows=$(gh pr list --repo "$REPO" --state open --base main \
              --label auto-update \
              --json number,headRefName,isDraft,headRepositoryOwner \
              --jq '.[] | select(.isDraft | not) | "\(.number):\(.headRepositoryOwner.login):\(.headRefName)"'); then
            echo "::error::gh pr list failed; aborting instead of silently treating a discovery outage as \"no PRs to update\""
            exit 1
          fi
          for row in $rows; do
            num="${row%%:*}"; rest="${row#*:}"; owner="${rest%%:*}"; head="${rest#*:}"
            # Fork PR heads must be owner-qualified for the compare API; same-repo
            # heads compare fine as bare branch names.
            if [ "$owner" = "$repo_owner" ]; then
              compare_head="$head"
            else
              compare_head="$owner:$head"
            fi
            behind=$(gh api "repos/$REPO/compare/main...$compare_head" --jq '.behind_by' 2>/dev/null || echo "")
            if [ -z "$behind" ]; then
              echo "::warning::PR #$num compare failed (head $compare_head)"; failed="$failed #$num"; continue
            fi
            if [ "$behind" -gt 0 ]; then
              if out=$(gh pr update-branch "$num" --repo "$REPO" 2>&1); then
                updated="$updated #$num"
              else
                # Usually a merge conflict with main; needs a human rebase.
                echo "::warning::PR #$num update-branch failed: $out"
                failed="$failed #$num"
              fi
            else
              skipped="$skipped #$num(up-to-date)"
            fi
          done
          {
            echo "## PR branch update"
            echo "- Updated:${updated:- none}"
            echo "- Needs human (conflict/update failed):${failed:- none}"
            echo "- Skipped (not behind):${skipped:- none}"
          } >> "$GITHUB_STEP_SUMMARY"
