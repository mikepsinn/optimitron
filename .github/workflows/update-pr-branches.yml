name: Update PR branches

# Whenever main moves (a merge landed), bring every open, behind, conflict-free
# PR branch up to date so the next merge never waits on a manual "Update
# branch" click. PRs with conflicts are skipped (they need a human anyway) and
# listed in the job summary.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-pr-branches
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update open PR branches that are behind main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          updated=""; skipped=""; failed=""
          # Compute behind-ness directly instead of trusting mergeStateStatus.
          # GitHub only reports mergeStateStatus=BEHIND when a PR is behind AND
          # otherwise mergeable; a behind PR with pending checks reports as
          # UNSTABLE/BLOCKED, which masks the behind-ness. Keying off the compare
          # API's behind_by catches every behind PR regardless of check/review
          # state — which is exactly the case a human ends up clicking by hand.
          for row in $(gh pr list --repo "$REPO" --state open --base main \
              --json number,headRefName,isDraft \
              --jq '.[] | select(.isDraft | not) | "\(.number):\(.headRefName)"'); do
            num="${row%%:*}"; head="${row#*:}"
            behind=$(gh api "repos/$REPO/compare/main...$head" --jq '.behind_by' 2>/dev/null || echo "")
            if [ -z "$behind" ]; then
              echo "::warning::PR #$num compare failed (head $head)"; failed="$failed #$num"; continue
            fi
            if [ "$behind" -gt 0 ]; then
              if out=$(gh pr update-branch "$num" --repo "$REPO" 2>&1); then
                updated="$updated #$num"
              else
                # Usually a merge conflict with main; needs a human rebase.
                echo "::warning::PR #$num update-branch failed: $out"
                failed="$failed #$num"
              fi
            else
              skipped="$skipped #$num(up-to-date)"
            fi
          done
          {
            echo "## PR branch update"
            echo "- Updated:${updated:- none}"
            echo "- Needs human (conflict/update failed):${failed:- none}"
            echo "- Skipped (not behind):${skipped:- none}"
          } >> "$GITHUB_STEP_SUMMARY"
