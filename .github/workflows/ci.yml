name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.manual.outputs.web_files_changed || steps.filter.outputs.web_files_changed }}
      web_files_changed: ${{ steps.manual.outputs.web_files_changed || steps.filter.outputs.web_files_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Treat manual runs as web-impacting
        id: manual
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: echo "web_files_changed=true" >> "$GITHUB_OUTPUT"

      - name: Detect web-impacting changes
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web_files_changed:
              - '.github/workflows/**'
              - '.github/scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'vitest*.ts'
              - 'packages/**/*.ts'
              - 'packages/**/*.tsx'
              - 'packages/**/*.js'
              - 'packages/**/*.jsx'
              - 'packages/**/*.mjs'
              - 'packages/**/*.cjs'
              - 'packages/**/*.json'
              - 'packages/**/*.css'
              - 'packages/**/*.scss'
              - 'packages/**/*.sql'
              - 'packages/**/*.prisma'
              - 'packages/**/*.yml'
              - 'packages/**/*.yaml'
              - 'packages/**/*.png'
              - 'packages/**/*.jpg'
              - 'packages/**/*.jpeg'
              - 'packages/**/*.webp'
              - 'packages/**/*.svg'
              - 'packages/db/prisma/**'
              - 'packages/db/src/managed-data/**'
              - 'packages/web/src/**'
              - 'packages/web/public/**'

  core-validate:
    name: core-validate
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@8.14.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Build
        run: pnpm --filter '!@optimitron/web' run build

      # Dropped the dry-run managed-data check that used to live here:
      # the same script runs with `--apply` against a freshly-migrated
      # CI Postgres in web-validate's seed step a few minutes later, and
      # that hard check catches every schema-data drift the dry-run did,
      # without the duplicate failure mode. `--dry-run` is still useful
      # locally (`pnpm db:sync:managed-data --dry-run`) to preview a
      # diff before pushing.

      - name: Typecheck
        run: pnpm --filter '!@optimitron/web' run typecheck

      - name: Lint
        run: pnpm --filter '!@optimitron/web' run lint

      - name: Test
        run: pnpm --filter '!@optimitron/web' run test

  web-static-validate:
    name: web-static-validate
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      # Must match vitest.config.ts hardcoded DATABASE_URL exactly. The hardcode
      # is a safety guard against `pnpm test` accidentally hitting prod when a
      # developer has the prod DATABASE_URL in their local env.
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      NEXTAUTH_SECRET: test-secret-minimum-32-characters-long-for-validation
      NEXTAUTH_URL: http://127.0.0.1:3001
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@8.14.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run GitHub automation script tests
        run: node --test .github/scripts/generate-pr-preview-links.test.mjs .github/scripts/preview-managed-data-filter.test.mjs .github/scripts/preview-masking-workflow-order.test.mjs .github/scripts/audit-sentry-preview.test.mjs

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Build web workspace dependencies
        run: pnpm --filter @optimitron/web run build:workspace-deps

      - name: Typecheck web app
        run: pnpm --filter @optimitron/web run typecheck:fast
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Run web unit tests
        run: pnpm --filter @optimitron/web run test

  web-e2e-validate:
    name: web-e2e-validate
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      # peaceiris/actions-gh-pages needs write to push the visual review to
      # the long-lived `gh-pages` branch.
      contents: write
      # `deployments: write` lets the "Create Visual review deployment"
      # step post per-commit deployment annotations in the PR timeline.
      deployments: write
      issues: write
      pull-requests: write
      statuses: write
    env:
      CI: true
      # Must match vitest.config.ts hardcoded DATABASE_URL exactly for safety.
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      NEXTAUTH_SECRET: test-secret-minimum-32-characters-long-for-validation
      NEXTAUTH_URL: http://127.0.0.1:3001
      VERCEL_CLI_VERSION: 50.37.3
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Skip web e2e validation
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') != true }}
        shell: bash
        run: echo "No web-impacting files changed; skipping Playwright install, smoke validation, and visual review."

      - name: Checkout
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enable Corepack
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        run: |
          corepack enable
          corepack prepare pnpm@8.14.0 --activate

      - name: Setup Node.js
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        uses: actions/cache@v4
        with:
          path: packages/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/web/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Apply database migrations
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        run: pnpm db:deploy

      - name: Build web workspace dependencies
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        run: pnpm --filter @optimitron/web run build:workspace-deps

      - name: Build web app
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm --filter @optimitron/web run build:fast

      - name: Cache Playwright browsers
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/web/package.json') }}

      - name: Install Playwright browser
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true && steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: pnpm --filter @optimitron/web exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true && steps.playwright-cache.outputs.cache-hit == 'true' }}
        run: pnpm --filter @optimitron/web exec playwright install-deps chromium

      - name: Sync managed data (idempotent upserts; matches production)
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        # Single source of truth for production-worthy bootstrap/reference data,
        # campaign records, and task triggers used by post-signin flows.
        run: pnpm db:sync:managed-data -- --apply

      - name: Run Playwright smoke validation
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        run: pnpm --filter @optimitron/web run e2e -- smoke

      - name: Run Playwright visual review
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        id: visual_regression
        run: pnpm --filter @optimitron/web run e2e -- visual

      - name: Upload PR visual screenshots for review publishing
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true && github.event_name == 'pull_request' && steps.visual_regression.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: web-pr-visual-screenshots
          path: packages/web/screenshots
          if-no-files-found: error

      - name: Build visual review index
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true && github.event_name != 'pull_request' }}
        env:
          VISUAL_REVIEW_COMMIT_SHA: ${{ github.sha }}
          VISUAL_REVIEW_BASE_URL: ""
          VISUAL_REVIEW_PR_NUMBER: ""
          VISUAL_REVIEW_HEAD_BRANCH: ${{ github.ref_name }}
          VISUAL_REVIEW_REPO: ${{ github.repository }}
        run: pnpm --filter @optimitron/web run visual:review

      - name: Summarize visual review
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          {
            echo "## Visual review"
            echo
            echo "- Open the \`web-visual-review\` artifact from this run."
            echo "- Start with \`packages/web/output/playwright/review/latest.html\` for the compact before/after screenshot gallery."
            echo "- Use the generated gallery for before/after diffs and changed-only review."
            echo "- Captured routes are defined in \`packages/web/e2e/visual-regression.spec.ts\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright visual review
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v6
        with:
          name: web-visual-review
          path: |
            packages/web/output/playwright/review
            packages/web/screenshots
            packages/web/playwright-report
            packages/web/test-results
          if-no-files-found: ignore

      - name: Upload Playwright artifacts
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true && failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: web-playwright-artifacts
          path: |
            packages/web/playwright-report
            packages/web/screenshots
            packages/web/public/img/screenshots
            packages/web/test-results
          if-no-files-found: ignore

  web-visual-review:
    name: web-visual-review
    if: ${{ github.event_name == 'pull_request' && needs.web-e2e-validate.result == 'success' && fromJSON(needs.changes.outputs.web || 'false') == true }}
    needs:
      - changes
      - web-e2e-validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      deployments: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@8.14.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download PR visual screenshots
        uses: actions/download-artifact@v6
        with:
          name: web-pr-visual-screenshots
          path: packages/web/screenshots

      - name: Preserve PR visual screenshots
        shell: bash
        run: |
          rm -rf packages/web/output/playwright/pr-screenshots
          mkdir -p packages/web/output/playwright
          cp -R packages/web/screenshots packages/web/output/playwright/pr-screenshots

      - name: Resolve main visual baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          baseline_root="packages/web/output/playwright/main-baseline"
          pr_screenshots="packages/web/output/playwright/pr-screenshots"
          rm -rf "$baseline_root"
          mkdir -p "$baseline_root"

          mapfile -t run_ids < <(gh run list \
            --workflow CI \
            --branch main \
            --status success \
            --limit 5 \
            --json databaseId \
            --jq '.[].databaseId')

          for run_id in "${run_ids[@]}"; do
            run_root="$baseline_root/run-$run_id"
            rm -rf "$run_root"
            mkdir -p "$run_root"

            if gh run download "$run_id" \
              --name web-visual-review \
              --dir "$run_root" >/dev/null 2>&1; then
              for screenshots_dir in "$run_root/screenshots" "$run_root/packages/web/screenshots"; do
                if [ -d "$screenshots_dir" ]; then
                  echo "VISUAL_BEFORE_ROOT=$GITHUB_WORKSPACE/$screenshots_dir" >> "$GITHUB_ENV"
                  echo "Downloaded visual baseline from main run $run_id."
                  rm -rf packages/web/screenshots
                  cp -R "$pr_screenshots" packages/web/screenshots
                  exit 0
                fi
              done
            fi

            rm -rf "$run_root"
          done

          echo "No usable main web-visual-review artifact found; visual review will show after screenshots only."
          rm -rf packages/web/screenshots
          cp -R "$pr_screenshots" packages/web/screenshots

      - name: Resolve PR preview URL
        id: pr_preview_url
        uses: actions/github-script@v8
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const ref = context.payload.pull_request.head.sha;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner,
              repo,
              ref,
              per_page: 100,
            });

            for (const deployment of deployments) {
              const env = deployment.environment || '';
              if (env.startsWith('visual-review')) continue;

              const statuses = await github.rest.repos.listDeploymentStatuses({
                owner,
                repo,
                deployment_id: deployment.id,
                per_page: 20,
              });
              const ready = statuses.data.find((status) =>
                status.state === 'success' &&
                status.environment_url &&
                /^https?:\/\//.test(status.environment_url)
              );
              if (ready) {
                return ready.environment_url;
              }
            }

            return '';

      - name: Post PR review packet preview links
        if: ${{ !cancelled() && steps.pr_preview_url.outputs.result != '' }}
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.pr_preview_url.outputs.result }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: issue_number, per_page: 100,
            });
            const changed = files
              .filter((f) => f.status !== 'removed')
              .map((f) => f.filename);

            const packetMarker = '<!-- pr-review-packet -->';
            const legacyMarker = '<!-- pr-preview-links -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = [...comments].reverse().find((c) =>
              c.body && (c.body.includes(packetMarker) || c.body.includes(legacyMarker))
            );
            const stdout = execFileSync(
              process.execPath,
              ['.github/scripts/generate-pr-preview-links.mjs'],
              {
                env: {
                  ...process.env,
                  CHANGED_FILES: JSON.stringify(changed),
                  EXISTING_COMMENT_BODY: existing?.body ?? '',
                },
                encoding: 'utf8',
              },
            );
            const body = stdout.trim();
            if (!body) return;

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      - name: Build visual review index
        if: always()
        env:
          VISUAL_REVIEW_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          VISUAL_REVIEW_BASE_URL: ${{ steps.pr_preview_url.outputs.result }}
          VISUAL_REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          VISUAL_REVIEW_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          VISUAL_REVIEW_REPO: ${{ github.repository }}
        run: pnpm --filter @optimitron/web run visual:review

      - name: Summarize visual review
        if: always()
        shell: bash
        run: |
          {
            echo "## Visual review"
            echo
            echo "- Open the \`web-visual-review\` artifact from this run."
            echo "- Start with \`packages/web/output/playwright/review/latest.html\` for the compact before/after screenshot gallery."
            echo "- Use the generated gallery for before/after diffs and changed-only review."
            echo "- Captured routes are defined in \`packages/web/e2e/visual-regression.spec.ts\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright visual review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-visual-review
          path: |
            packages/web/output/playwright/review
            packages/web/screenshots
            packages/web/playwright-report
            packages/web/test-results
          if-no-files-found: ignore

      - name: Prepare per-PR visual review directory
        id: prepare_pages
        shell: bash
        run: |
          head_sha="${{ github.event.pull_request.head.sha }}"
          short_sha="${head_sha:0:12}"
          pr_root="packages/web/output/playwright/pages-per-pr/pr-${{ github.event.pull_request.number }}"
          commit_dir="$pr_root/$short_sha"
          latest_dir="$pr_root/latest"
          rm -rf "$pr_root"
          mkdir -p "$commit_dir" "$latest_dir"
          cp -R packages/web/output/playwright/review/. "$commit_dir/"
          cp -R packages/web/output/playwright/review/. "$latest_dir/"
          if [ -f "$commit_dir/latest.html" ]; then
            cp "$commit_dir/latest.html" "$commit_dir/index.html"
          fi
          if [ -f "$latest_dir/latest.html" ]; then
            cp "$latest_dir/latest.html" "$latest_dir/index.html"
          fi
          publish_root="packages/web/output/playwright/pages-per-pr"
          touch "$publish_root/.nojekyll"
          cat > "$publish_root/index.html" <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Optimitron Visual Reviews</title>
            </head>
            <body>
              <h1>Optimitron Visual Reviews</h1>
              <p>Open the "Visual review" check on a pull request for its review page.</p>
            </body>
          </html>
          HTML
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "publish_dir=packages/web/output/playwright/pages-per-pr" >> "$GITHUB_OUTPUT"

      - name: Publish visual review to gh-pages
        id: visual_review_pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.prepare_pages.outputs.publish_dir }}
          publish_branch: gh-pages
          keep_files: true
          enable_jekyll: false
          commit_message: "Visual review for pr-${{ github.event.pull_request.number }}@${{ steps.prepare_pages.outputs.short_sha }}"
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      - name: Wait for visual review page
        id: wait_visual_review_pages
        if: ${{ !cancelled() && steps.visual_review_pages.outcome == 'success' }}
        shell: bash
        run: |
          target_url="https://mikepsinn.github.io/optimitron/pr-${{ github.event.pull_request.number }}/${{ steps.prepare_pages.outputs.short_sha }}/latest.html"
          echo "target_url=$target_url" >> "$GITHUB_OUTPUT"
          echo "Waiting for $target_url"
          for attempt in $(seq 1 90); do
            status="$(curl -L -sS --connect-timeout 5 --max-time 15 -o /tmp/visual-review-latest.html -w "%{http_code}" "$target_url" || true)"
            if [ "$status" = "200" ] && [ -s /tmp/visual-review-latest.html ]; then
              echo "Visual review page is live after attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt/90 returned HTTP $status; retrying in 10s."
            sleep 10
          done
          echo "::error::Visual review page did not become available: $target_url"
          exit 1

      - name: Post Visual review commit status
        if: ${{ !cancelled() && steps.wait_visual_review_pages.outcome == 'success' }}
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const headSha = context.payload.pull_request.head.sha;
            const shortSha = headSha.slice(0, 12);
            const target_url = `https://mikepsinn.github.io/optimitron/pr-${issue_number}/${shortSha}/latest.html`;
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: headSha,
              state: 'success',
              context: 'Visual review',
              description: shortSha,
              target_url,
            });

      - name: Create Visual review deployment
        if: ${{ !cancelled() && steps.wait_visual_review_pages.outcome == 'success' }}
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const headSha = context.payload.pull_request.head.sha;
            const shortSha = headSha.slice(0, 12);
            const target_url = `https://mikepsinn.github.io/optimitron/pr-${issue_number}/${shortSha}/latest.html`;
            const environment = `visual-review/pr-${issue_number}`;

            const { data: deployment } = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref: headSha,
              environment,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false,
              description: `Visual review · ${shortSha}`,
            });

            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: deployment.id,
              state: 'success',
              environment,
              environment_url: target_url,
              log_url: target_url,
              description: 'Visual review ready',
            });

      - name: Update PR review packet with visual review
        if: ${{ !cancelled() && steps.wait_visual_review_pages.outcome == 'success' && steps.pr_preview_url.outputs.result != '' }}
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.pr_preview_url.outputs.result }}
          VISUAL_REVIEW_MANIFEST_PATH: packages/web/output/playwright/review/manifest.json
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const headSha = context.payload.pull_request.head.sha;
            const shortSha = headSha.slice(0, 12);
            const visualReviewUrl = `https://mikepsinn.github.io/optimitron/pr-${issue_number}/${shortSha}/latest.html`;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: issue_number, per_page: 100,
            });
            const changed = files
              .filter((f) => f.status !== 'removed')
              .map((f) => f.filename);

            const packetMarker = '<!-- pr-review-packet -->';
            const legacyMarker = '<!-- pr-preview-links -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = [...comments].reverse().find((c) =>
              c.body && (c.body.includes(packetMarker) || c.body.includes(legacyMarker))
            );

            const stdout = execFileSync(
              process.execPath,
              ['.github/scripts/generate-pr-preview-links.mjs'],
              {
                env: {
                  ...process.env,
                  CHANGED_FILES: JSON.stringify(changed),
                  EXISTING_COMMENT_BODY: existing?.body ?? '',
                  VISUAL_REVIEW_URL: visualReviewUrl,
                },
                encoding: 'utf8',
              },
            );
            const body = stdout.trim();
            if (!body) return;

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  web-validate:
    name: web-validate
    if: always() && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    needs:
      - web-static-validate
      - web-e2e-validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify web validation lanes passed
        shell: bash
        run: |
          static_result="${{ needs.web-static-validate.result }}"
          e2e_result="${{ needs.web-e2e-validate.result }}"
          echo "web-static-validate: $static_result"
          echo "web-e2e-validate: $e2e_result"
          if [ "$static_result" != "success" ] || [ "$e2e_result" != "success" ]; then
            exit 1
          fi

  sync-preview-managed-data:
    name: sync-preview-managed-data
    if: github.event_name == 'pull_request'
    needs: web-validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Preview
    permissions:
      contents: read
      pull-requests: read
    env:
      CI: true
      VERCEL_CLI_VERSION: 50.37.3
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PREVIEW_GIT_BRANCH: ${{ github.head_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Detect preview database sync changes
        id: preview_data_changes
        uses: actions/github-script@v8
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const filter = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/preview-managed-data-filter.mjs`).href
            );
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const filenames = files
              .filter((file) => file.status !== 'removed')
              .map((file) => file.filename);
            const matches = filter.getPreviewManagedDataSyncMatches(filenames);
            const medicalMatches = filter.getPreviewMedicalReferenceSyncMatches(filenames);
            const shouldSync = matches.length > 0;
            const skipMedicalReference = shouldSync && medicalMatches.length === 0;
            core.setOutput('should_sync', shouldSync ? 'true' : 'false');
            core.setOutput('matched_files', matches.join('\n'));
            core.setOutput('medical_reference_files', medicalMatches.join('\n'));
            core.setOutput('skip_medical_reference', skipMedicalReference ? '1' : '0');
            core.setOutput('changed_file_count', String(filenames.length));
            if (!shouldSync) {
              await core.summary
                .addHeading('Preview database sync')
                .addRaw(`Skipped: ${filenames.length} changed file(s), none touch managed-data, schema, masking, or preview seed inputs.`)
                .write();
            }

      - name: Check Preview database sync secrets
        if: steps.preview_data_changes.outputs.should_sync == 'true'
        id: preview_secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          missing=()
          if [ -z "$VERCEL_TOKEN" ]; then
            missing+=("VERCEL_TOKEN")
          fi

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::error::Preview database sync is blocked: the GitHub Preview environment is missing ${missing[*]}. Add the secrets in repo Settings → Environments → Preview before retrying."
          {
            echo "## Preview database sync"
            echo
            echo "Blocked: GitHub Preview environment is missing required secrets."
            for name in "${missing[@]}"; do
              echo "- Missing \`$name\`."
            done
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Enable Corepack
        if: steps.preview_data_changes.outputs.should_sync == 'true' && steps.preview_secrets.outputs.configured == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@8.14.0 --activate

      - name: Setup Node.js
        if: steps.preview_data_changes.outputs.should_sync == 'true' && steps.preview_secrets.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.preview_data_changes.outputs.should_sync == 'true' && steps.preview_secrets.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel preview settings
        if: steps.preview_data_changes.outputs.should_sync == 'true' && steps.preview_secrets.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx vercel@${VERCEL_CLI_VERSION} pull --yes --environment=preview --git-branch "$PREVIEW_GIT_BRANCH" --token "$VERCEL_TOKEN"

      - name: Export preview database env
        if: steps.preview_data_changes.outputs.should_sync == 'true' && steps.preview_secrets.outputs.configured == 'true'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const envPath = ".vercel/.env.preview.local";

          function parseEnv(contents) {
            const entries = {};
            for (const rawLine of contents.split(/\r?\n/u)) {
              const line = rawLine.trim();
              if (!line || line.startsWith("#")) continue;
              const separatorIndex = line.indexOf("=");
              if (separatorIndex <= 0) continue;

              const key = line.slice(0, separatorIndex).trim();
              let value = line.slice(separatorIndex + 1).trim();
              if (
                (value.startsWith('"') && value.endsWith('"')) ||
                (value.startsWith("'") && value.endsWith("'"))
              ) {
                value = value.slice(1, -1);
              }
              entries[key] = value;
            }
            return entries;
          }

          const parsed = parseEnv(fs.readFileSync(envPath, "utf8"));
          if (!parsed.DATABASE_URL) {
            throw new Error(`Vercel preview env did not include DATABASE_URL in ${envPath}.`);
          }

          const exportedKeys = [
            "DATABASE_URL",
            "DATABASE_URL_UNPOOLED",
            "NEON_PROJECT_ID",
            "NEON_BRANCH_ID",
            "NEON_DATABASE_NAME",
            "PGDATABASE",
          ];

          for (const key of exportedKeys) {
            const value = parsed[key];
            if (!value) continue;
            console.log(`::add-mask::${value}`);
            const delimiter = `managed_data_${key}_${Math.random().toString(36).slice(2)}`;
            fs.appendFileSync(
              process.env.GITHUB_ENV,
              `${key}<<${delimiter}\n${value}\n${delimiter}\n`,
            );
          }

          const target = new URL(parsed.DATABASE_URL);
          console.log(`Loaded Vercel preview database env for ${target.hostname}.`);
          NODE

      - name: Apply preview database migrations
        if: steps.preview_data_changes.outputs.should_sync == 'true' && steps.preview_secrets.outputs.configured == 'true'
        env:
          PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK: "1"
        run: pnpm db:deploy

      - name: Apply preview database anonymization
        if: steps.preview_data_changes.outputs.should_sync == 'true' && steps.preview_secrets.outputs.configured == 'true'
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail

          database_url="${DATABASE_URL_UNPOOLED:-${DATABASE_URL:-}}"
          if [ -z "$database_url" ]; then
            echo "::error::DATABASE_URL_UNPOOLED and DATABASE_URL are both missing from the pulled Vercel preview env."
            exit 1
          fi

          echo "::add-mask::$database_url"

          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

          psql "$database_url" --set ON_ERROR_STOP=1 --file packages/db/prisma/anonymization-setup.sql
          psql "$database_url" --set ON_ERROR_STOP=1 --file packages/db/prisma/anonymization-updates.sql

      - name: Sync preview managed data
        if: steps.preview_data_changes.outputs.should_sync == 'true' && steps.preview_secrets.outputs.configured == 'true'
        env:
          MANAGED_DATA_ALLOW_REMOTE_APPLY: "1"
          MANAGED_DATA_SKIP_MEDICAL_REFERENCE: ${{ steps.preview_data_changes.outputs.skip_medical_reference }}
        run: pnpm db:sync:managed-data -- --apply

      - name: Re-apply preview database anonymization after managed data
        if: steps.preview_data_changes.outputs.should_sync == 'true' && steps.preview_secrets.outputs.configured == 'true'
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail

          database_url="${DATABASE_URL_UNPOOLED:-${DATABASE_URL:-}}"
          if [ -z "$database_url" ]; then
            echo "::error::DATABASE_URL_UNPOOLED and DATABASE_URL are both missing from the pulled Vercel preview env."
            exit 1
          fi

          echo "::add-mask::$database_url"

          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

          psql "$database_url" --set ON_ERROR_STOP=1 --file packages/db/prisma/anonymization-setup.sql
          psql "$database_url" --set ON_ERROR_STOP=1 --file packages/db/prisma/anonymization-updates.sql

      - name: Verify preview masking applied to rows
        if: steps.preview_data_changes.outputs.should_sync == 'true' && steps.preview_secrets.outputs.configured == 'true'
        shell: bash
        run: node packages/web/scripts/verify-preview-masking.mjs

      - name: Cleanup pulled Vercel env files
        if: always() && steps.preview_data_changes.outputs.should_sync == 'true' && steps.preview_secrets.outputs.configured == 'true'
        shell: bash
        run: rm -f .vercel/.env*.local .vercel/*.env*

      - name: Summarize preview database sync
        if: steps.preview_data_changes.outputs.should_sync == 'true' && steps.preview_secrets.outputs.configured == 'true'
        env:
          MANAGED_DATA_SKIP_MEDICAL_REFERENCE: ${{ steps.preview_data_changes.outputs.skip_medical_reference }}
        shell: bash
        run: |
          {
            echo "## Preview database sync"
            echo
            echo "- Pulled Vercel preview env for \`$PREVIEW_GIT_BRANCH\`."
            echo "- Applied Prisma migrations to the branch preview database."
            echo "- Applied preview anonymization setup and direct SQL masking updates."
            echo "- Synced managed data with idempotent upserts."
            echo "- Re-applied preview anonymization after managed-data sync."
            echo "- Verified sampled masked row shapes after the final update pass."
            if [ "$MANAGED_DATA_SKIP_MEDICAL_REFERENCE" = "1" ]; then
              echo "- Skipped medical reference rows because no medical dataset or seed-data files changed; disposable CI still runs the full local sync."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: deploy-production
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: web-validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.deployment_url }}
    env:
      VERCEL_CLI_VERSION: 50.37.3
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@8.14.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js production build
        uses: actions/cache@v4
        with:
          path: packages/web/.next/cache
          key: nextjs-production-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/web/src/**', 'packages/web/next.config.js', 'packages/web/package.json') }}
          restore-keys: |
            nextjs-production-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-production-${{ runner.os }}-
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Verify Vercel configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing GitHub secret VERCEL_TOKEN"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing GitHub variable VERCEL_ORG_ID"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing GitHub variable VERCEL_PROJECT_ID"; exit 1; }

      - name: Verify production database configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "Missing production environment secret DATABASE_URL"; exit 1; }

      - name: Pull Vercel production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm dlx vercel@${VERCEL_CLI_VERSION} build --prod --token "$VERCEL_TOKEN"

      - name: Apply production database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK: "1"
        run: pnpm db:deploy

      - name: Sync canonical production data (idempotent upserts)
        # Single managed sync for reference data, campaign records, treaty tasks,
        # referendums, demo fixtures, and trigger blueprints.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MANAGED_DATA_ALLOW_REMOTE_APPLY: "1"
        run: pnpm db:sync:managed-data -- --apply

      - name: Deploy production artifact
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(pnpm dlx vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --token "$VERCEL_TOKEN" --yes | tail -n 1 | tr -d '\r')"
          case "$deployment_url" in
            https://*) ;;
            *) deployment_url="https://$deployment_url" ;;
          esac
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
