name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-validate:
    name: core-validate
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@8.14.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Build
        run: pnpm --filter '!@optimitron/web' run build

      - name: Verify managed data sync
        run: pnpm db:sync:managed-data -- --dry-run

      - name: Typecheck
        run: pnpm --filter '!@optimitron/web' run typecheck

      - name: Lint
        run: pnpm --filter '!@optimitron/web' run lint

      - name: Test
        run: pnpm --filter '!@optimitron/web' run test

  web-validate:
    name: web-validate
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      # peaceiris/actions-gh-pages needs write to push the visual review to
      # the long-lived `gh-pages` branch.
      contents: write
      # `deployments: write` lets the "Create Visual review deployment"
      # step post per-commit deployment annotations in the PR timeline.
      deployments: write
      issues: write
      pull-requests: write
      statuses: write
    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/optimitron_web_ci
      NEXTAUTH_SECRET: test-secret-minimum-32-characters-long-for-validation
      NEXTAUTH_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3001
      VERCEL_CLI_VERSION: 50.37.3
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: optimitron_web_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d optimitron_web_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@8.14.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: packages/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/web/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Build web workspace dependencies
        run: pnpm --filter @optimitron/web run build:workspace-deps

      - name: Typecheck web app
        run: pnpm --filter @optimitron/web run typecheck:fast

      - name: Run web unit tests
        run: pnpm --filter @optimitron/web run test

      - name: Build web app
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm --filter @optimitron/web run build:fast

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/web/package.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @optimitron/web exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @optimitron/web exec playwright install-deps chromium

      - name: Run Playwright smoke validation
        run: pnpm --filter @optimitron/web run e2e -- smoke

      - name: Seed visual review data
        run: |
          pnpm --filter @optimitron/db run seed:bootstrap
          pnpm --filter @optimitron/db run seed:demo
          pnpm --filter @optimitron/db run seed:tasks
          pnpm db:sync:managed-data -- --apply

      - name: Run Playwright visual review
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
          ARGOS_IGNORE_UPLOAD_FAILURES: ${{ secrets.ARGOS_TOKEN == '' && '1' || '0' }}
        run: pnpm --filter @optimitron/web run e2e -- visual

      - name: Preserve PR visual screenshots
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          rm -rf packages/web/output/playwright/pr-screenshots
          if [ -d packages/web/screenshots ]; then
            mkdir -p packages/web/output/playwright
            cp -R packages/web/screenshots packages/web/output/playwright/pr-screenshots
          fi

      - name: Resolve main visual baseline
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          baseline_root="packages/web/output/playwright/main-baseline"
          pr_screenshots="packages/web/output/playwright/pr-screenshots"
          rm -rf "$baseline_root"
          mkdir -p "$baseline_root"

          # `--limit 5` instead of 20: the previous successful main run
          # virtually always has the artifact. Iterating 20 deep mostly
          # burned API calls + network setup time without finding anything
          # the first 5 didn't.
          mapfile -t run_ids < <(gh run list \
            --workflow CI \
            --branch main \
            --status success \
            --limit 5 \
            --json databaseId \
            --jq '.[].databaseId')

          for run_id in "${run_ids[@]}"; do
            run_root="$baseline_root/run-$run_id"
            rm -rf "$run_root"
            mkdir -p "$run_root"

            if gh run download "$run_id" \
              --name web-visual-review \
              --dir "$run_root" >/dev/null 2>&1; then
              for screenshots_dir in "$run_root/screenshots" "$run_root/packages/web/screenshots"; do
                if [ -d "$screenshots_dir" ]; then
                  echo "VISUAL_BEFORE_ROOT=$GITHUB_WORKSPACE/$screenshots_dir" >> "$GITHUB_ENV"
                  echo "Downloaded visual baseline from main run $run_id."
                  rm -rf packages/web/screenshots
                  if [ -d "$pr_screenshots" ]; then
                    cp -R "$pr_screenshots" packages/web/screenshots
                  fi
                  exit 0
                fi
              done
            fi

            rm -rf "$run_root"
          done

          echo "No usable main web-visual-review artifact found; visual review will show after screenshots only."
          rm -rf packages/web/screenshots
          if [ -d "$pr_screenshots" ]; then
            cp -R "$pr_screenshots" packages/web/screenshots
          fi

      - name: Resolve PR preview URL
        if: always() && github.event_name == 'pull_request'
        id: pr_preview_url
        uses: actions/github-script@v8
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const ref = context.payload.pull_request.head.sha;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner,
              repo,
              ref,
              per_page: 100,
            });

            for (const deployment of deployments) {
              // Skip our own visual-review deployments — we set up
              // `visual-review/pr-N` to drive the inline timeline annotation
              // for the gh-pages review URL, but here we want the *app*
              // preview URL (Vercel) to feed VISUAL_REVIEW_BASE_URL.
              const env = deployment.environment || '';
              if (env.startsWith('visual-review')) continue;

              const statuses = await github.rest.repos.listDeploymentStatuses({
                owner,
                repo,
                deployment_id: deployment.id,
                per_page: 20,
              });
              const ready = statuses.data.find((status) =>
                status.state === 'success' &&
                status.environment_url &&
                /^https?:\/\//.test(status.environment_url)
              );
              if (ready) {
                return ready.environment_url;
              }
            }

            return '';

      - name: Build visual review index
        if: always()
        env:
          VISUAL_REVIEW_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VISUAL_REVIEW_BASE_URL: ${{ steps.pr_preview_url.outputs.result }}
          # Feeds the per-route "Copy context" button on latest.html so the
          # generated clipboard payload includes the right PR/branch/repo
          # identifiers for whoever the reviewer is pasting it to.
          VISUAL_REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          VISUAL_REVIEW_HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          VISUAL_REVIEW_REPO: ${{ github.repository }}
        run: pnpm --filter @optimitron/web run visual:review

      - name: Summarize visual review
        if: always()
        shell: bash
        run: |
          {
            echo "## Visual review"
            echo
            echo "- Open the \`web-visual-review\` artifact from this run."
            echo "- Start with \`packages/web/output/playwright/review/latest.html\` for the compact before/after screenshot gallery."
            echo "- Use the Argos check on the pull request for before/after diffs and changed-only review."
            echo "- Captured routes are defined in \`packages/web/e2e/visual-regression.spec.ts\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright visual review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-visual-review
          path: |
            packages/web/output/playwright/review
            packages/web/screenshots
            packages/web/playwright-report
            packages/web/test-results
          if-no-files-found: ignore

      # Publish the per-PR visual review to the long-lived `gh-pages` branch
      # so reviews from different PRs don't clobber each other. The previous
      # setup used `actions/deploy-pages`, which atomically REPLACES the
      # entire Pages site each deploy — so whenever any PR's CI finished,
      # every other PR's review URL went 404 until that PR's CI ran again.
      #
      # `peaceiris/actions-gh-pages` with `keep_files: true` writes only the
      # current PR's directory and preserves everything else on `gh-pages`.
      #
      # One-time repo setup: Settings → Pages → Source must be set to
      # "Deploy from a branch" with branch `gh-pages` (root). The action
      # creates the branch on its first push.
      # `!cancelled()` instead of `always()` so a cancelled run (concurrency
      # cut-off after a newer push, manual cancel, etc.) doesn't publish a
      # partial visual review with missing "after" screenshots. Real
      # test failures still publish — reviewers want to see what broke.
      - name: Prepare per-PR visual review directory
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        id: prepare_pages
        shell: bash
        run: |
          head_sha="${{ github.event.pull_request.head.sha }}"
          short_sha="${head_sha:0:12}"
          pr_root="packages/web/output/playwright/pages-per-pr/pr-${{ github.event.pull_request.number }}"
          commit_dir="$pr_root/$short_sha"
          latest_dir="$pr_root/latest"
          rm -rf "$pr_root"
          mkdir -p "$commit_dir" "$latest_dir"
          cp -R packages/web/output/playwright/review/. "$commit_dir/"
          cp -R packages/web/output/playwright/review/. "$latest_dir/"
          # `latest.html` is the entry point the build script writes. Also
          # publish it as `index.html` so bare `pr-N/latest/` and
          # `pr-N/<sha>/` directory URLs (no filename) resolve to the review
          # page instead of returning 404.
          if [ -f "$commit_dir/latest.html" ]; then
            cp "$commit_dir/latest.html" "$commit_dir/index.html"
          fi
          if [ -f "$latest_dir/latest.html" ]; then
            cp "$latest_dir/latest.html" "$latest_dir/index.html"
          fi
          # Seed `.nojekyll` and a root `index.html` at the publish root so the
          # gh-pages site doesn't try to render through Jekyll and so the
          # bare https://<user>.github.io/<repo>/ URL renders something
          # meaningful. `keep_files: true` preserves these across deploys.
          publish_root="packages/web/output/playwright/pages-per-pr"
          touch "$publish_root/.nojekyll"
          cat > "$publish_root/index.html" <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Optimitron Visual Reviews</title>
            </head>
            <body>
              <h1>Optimitron Visual Reviews</h1>
              <p>Open the "Visual review" check on a pull request for its review page.</p>
            </body>
          </html>
          HTML
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "publish_dir=packages/web/output/playwright/pages-per-pr" >> "$GITHUB_OUTPUT"

      - name: Publish visual review to gh-pages
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        id: visual_review_pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.prepare_pages.outputs.publish_dir }}
          publish_branch: gh-pages
          keep_files: true
          enable_jekyll: false
          commit_message: "Visual review for pr-${{ github.event.pull_request.number }}@${{ steps.prepare_pages.outputs.short_sha }}"
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      - name: Post Visual review commit status
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const headSha = context.payload.pull_request.head.sha;
            const shortSha = headSha.slice(0, 12);
            const target_url = `https://mikepsinn.github.io/optimitron/pr-${issue_number}/${shortSha}/latest.html`;
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: headSha,
              state: 'success',
              context: 'Visual review',
              description: shortSha,
              target_url,
            });

      # Create a GitHub Deployment + DeploymentStatus per commit so the PR
      # timeline shows an inline "deployed to visual-review X minutes ago"
      # annotation under each commit, the way Vercel's bot does. Each commit
      # gets its own annotation linking to the per-commit gh-pages URL,
      # which is immutable thanks to keep_files: true on the gh-pages
      # publish step. transient_environment: true tells GitHub to retire
      # older deployments for this environment automatically.
      - name: Create Visual review deployment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const headSha = context.payload.pull_request.head.sha;
            const shortSha = headSha.slice(0, 12);
            const target_url = `https://mikepsinn.github.io/optimitron/pr-${issue_number}/${shortSha}/latest.html`;
            const environment = `visual-review/pr-${issue_number}`;

            const { data: deployment } = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref: headSha,
              environment,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false,
              description: `Visual review · ${shortSha}`,
            });

            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: deployment.id,
              state: 'success',
              environment,
              environment_url: target_url,
              log_url: target_url,
              description: 'Visual review ready',
            });

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: web-playwright-artifacts
          path: |
            packages/web/playwright-report
            packages/web/public/img/screenshots
          if-no-files-found: ignore

  deploy-production:
    name: deploy-production
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: web-validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.deployment_url }}
    env:
      VERCEL_CLI_VERSION: 50.37.3
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@8.14.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js production build
        uses: actions/cache@v4
        with:
          path: packages/web/.next/cache
          key: nextjs-production-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/web/src/**', 'packages/web/next.config.js', 'packages/web/package.json') }}
          restore-keys: |
            nextjs-production-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-production-${{ runner.os }}-
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Verify Vercel configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing GitHub secret VERCEL_TOKEN"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing GitHub variable VERCEL_ORG_ID"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing GitHub variable VERCEL_PROJECT_ID"; exit 1; }

      - name: Verify production database configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "Missing production environment secret DATABASE_URL"; exit 1; }

      - name: Pull Vercel production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm dlx vercel@${VERCEL_CLI_VERSION} build --prod --token "$VERCEL_TOKEN"

      - name: Apply production database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK: "1"
        run: pnpm db:deploy

      - name: Sync managed production data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:sync:managed-data -- --apply

      - name: Deploy production artifact
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(pnpm dlx vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --token "$VERCEL_TOKEN" --yes | tail -n 1 | tr -d '\r')"
          case "$deployment_url" in
            https://*) ;;
            *) deployment_url="https://$deployment_url" ;;
          esac
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
