name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      web: ${{ steps.manual.outputs.web_files_changed || steps.main.outputs.web_files_changed || steps.filter.outputs.web_files_changed }}
      web_files_changed: ${{ steps.manual.outputs.web_files_changed || steps.main.outputs.web_files_changed || steps.filter.outputs.web_files_changed }}
      site_apps: ${{ steps.manual.outputs.site_apps_changed || steps.main.outputs.site_apps_changed || steps.filter.outputs.site_apps_changed }}
    steps:
      - name: Treat manual runs as web-impacting
        id: manual
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          echo "web_files_changed=true" >> "$GITHUB_OUTPUT"
          echo "site_apps_changed=true" >> "$GITHUB_OUTPUT"

      - name: Treat main pushes as full visual baselines
        id: main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          echo "web_files_changed=true" >> "$GITHUB_OUTPUT"
          echo "site_apps_changed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout for local change detection
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Detect web-impacting changes
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@v3
        with:
          # Local git diff avoids REST pagination and rate limits on large moves.
          token: ""
          filters: |
            web_files_changed:
              - '.github/workflows/**'
              - '.github/scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'vitest*.ts'
              - 'packages/**/*.ts'
              - 'packages/**/*.tsx'
              - 'packages/**/*.js'
              - 'packages/**/*.jsx'
              - 'packages/**/*.mjs'
              - 'packages/**/*.cjs'
              - 'packages/**/*.json'
              - 'packages/**/*.css'
              - 'packages/**/*.scss'
              - 'packages/**/*.sql'
              - 'packages/**/*.prisma'
              - 'packages/**/*.yml'
              - 'packages/**/*.yaml'
              - 'packages/**/*.png'
              - 'packages/**/*.jpg'
              - 'packages/**/*.jpeg'
              - 'packages/**/*.webp'
              - 'packages/**/*.svg'
              - 'packages/db/prisma/**'
              - 'packages/db/src/managed-data/**'
              - 'apps/optimitron/**'
            site_apps_changed:
              - 'apps/acceleratedmedicine/**'
              - 'apps/curedao/**'
              - 'apps/dfda/**'
              - 'apps/trialabundancesurvey/**'
              - 'apps/warondisease/**'
              - 'apps/wishocracy/**'
              - 'packages/db/**'
              - 'packages/site-kit/**'
              - 'scripts/site-app-navigation.test.ts'
              - 'scripts/site-app-visual-routes.mjs'
              - 'scripts/smoke-site-apps.mjs'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  leak-scan:
    name: leak-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Scan tracked files for private-information leaks
        run: node scripts/leak-scan.mjs

  core-validate:
    name: core-validate
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@8.14.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:deploy

      # Site apps under apps/* are validated in the site-app jobs.
      # (they are Next entrypoints, not library packages). Exclude them here
      # so recursive package filters do not `next build` unfinished brands.
      - name: Build
        run: pnpm --filter '!@optimitron/web' --filter '!@apps/*' run build

      # Dropped the dry-run managed-data check that used to live here:
      # the same script runs with `--apply` against a freshly-migrated
      # CI Postgres in web-validate's seed step a few minutes later, and
      # that hard check catches every schema-data drift the dry-run did,
      # without the duplicate failure mode. `--dry-run` is still useful
      # locally (`pnpm db:sync:managed-data --dry-run`) to preview a
      # diff before pushing.

      - name: Typecheck
        run: pnpm --filter '!@optimitron/web' --filter '!@apps/*' run typecheck

      - name: Lint
        run: pnpm --filter '!@optimitron/web' --filter '!@apps/*' run lint

      - name: Test
        run: pnpm --filter '!@optimitron/web' --filter '!@apps/*' run test

  site-apps-static-validate:
    name: site-apps-static-validate
    # Gates all apps/* site packages (shared @optimitron/db schema).
    # Typecheck every app; unit-test apps with vitest unit suites; WoD DB smoke.
    # apps/optimitron keeps its own e2e/deploy smoke — not replaced here.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NODE_ENV: test
      # Match other optimitron CI Postgres services (shared schema, not per-app DBs)
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      NEXTAUTH_SECRET: test-secret-minimum-32-characters-long-for-validation
      NEXTAUTH_URL: http://127.0.0.1:3010
      NEXT_PUBLIC_SITE_VARIANT: warondisease.org
      SKIP_DB_TEST_SETUP: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Skip site-app validation
        if: ${{ fromJSON(needs.changes.outputs.site_apps || 'false') != true }}
        shell: bash
        run: echo "No apps/* or packages/db changes; skipping site-app validation."

      - name: Checkout
        if: ${{ fromJSON(needs.changes.outputs.site_apps || 'false') == true }}
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enable Corepack
        if: ${{ fromJSON(needs.changes.outputs.site_apps || 'false') == true }}
        run: |
          corepack enable
          corepack prepare pnpm@8.14.0 --activate

      - name: Setup Node.js
        if: ${{ fromJSON(needs.changes.outputs.site_apps || 'false') == true }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: ${{ fromJSON(needs.changes.outputs.site_apps || 'false') == true }}
        run: pnpm install --frozen-lockfile

      - name: Verify site-app navigation routes
        if: ${{ fromJSON(needs.changes.outputs.site_apps || 'false') == true }}
        run: pnpm test:site-app-navigation

      - name: Apply database migrations
        if: ${{ fromJSON(needs.changes.outputs.site_apps || 'false') == true }}
        run: pnpm db:deploy

      - name: Generate Prisma client
        if: ${{ fromJSON(needs.changes.outputs.site_apps || 'false') == true }}
        run: pnpm db:generate

      - name: Build app dependencies
        if: ${{ fromJSON(needs.changes.outputs.site_apps || 'false') == true }}
        run: pnpm build:app-dependencies

      - name: Typecheck all @apps/*
        if: ${{ fromJSON(needs.changes.outputs.site_apps || 'false') == true }}
        run: pnpm typecheck:apps
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Lint all @apps/*
        if: ${{ fromJSON(needs.changes.outputs.site_apps || 'false') == true }}
        run: pnpm lint:apps

      - name: Treaty DB smoke (ReferendumVote path)
        if: ${{ fromJSON(needs.changes.outputs.site_apps || 'false') == true }}
        run: pnpm smoke:warondisease-db

      - name: Unit tests @apps/* (excluding integration/)
        if: ${{ fromJSON(needs.changes.outputs.site_apps || 'false') == true }}
        run: pnpm test:apps:unit

  site-apps-build:
    name: site-apps-build (${{ matrix.app }})
    if: ${{ fromJSON(needs.changes.outputs.site_apps || 'false') == true }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: warondisease
            variant: warondisease.org
            port: 4010
            postgres_image: postgres:16
            requires_database: true
          - app: dfda
            variant: dfda
            port: 4011
            postgres_image: ""
            requires_database: false
          - app: wishocracy
            variant: wishocracy.org
            port: 4013
            postgres_image: postgres:16
            requires_database: true
          - app: trialabundancesurvey
            variant: trialabundancesurvey.org
            port: 4014
            postgres_image: postgres:16
            requires_database: true
          - app: curedao
            variant: curedao.org
            port: 4015
            postgres_image: ""
            requires_database: false
          - app: acceleratedmedicine
            variant: acceleratedmedicine.org
            port: 4016
            postgres_image: ""
            requires_database: false
    env:
      CI: true
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      NEXTAUTH_SECRET: test-secret-minimum-32-characters-long-for-validation
      NEXTAUTH_URL: http://127.0.0.1:${{ matrix.port }}
      NEXT_PUBLIC_SITE_VARIANT: ${{ matrix.variant }}
      SKIP_DB_TEST_SETUP: "1"
      NODE_OPTIONS: --max-old-space-size=6144
    services:
      postgres:
        image: ${{ matrix.postgres_image }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@8.14.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/${{ matrix.app }}/.next/cache
          key: site-app-next-${{ runner.os }}-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            site-app-next-${{ runner.os }}-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml') }}-
            site-app-next-${{ runner.os }}-${{ matrix.app }}-

      - name: Apply database migrations
        if: ${{ matrix.requires_database }}
        run: pnpm db:deploy

      - name: Build app dependencies
        run: pnpm build:app-dependencies

      - name: Sync managed data for authenticated screenshots
        if: ${{ matrix.requires_database }}
        env:
          MANAGED_DATA_SKIP_MEDICAL_REFERENCE: "1"
        run: pnpm db:sync:managed-data -- --apply

      - name: Prepare local authenticated visual fixtures
        if: ${{ matrix.requires_database }}
        env:
          SITE_APP_VISUAL_FIXTURES: "1"
        run: pnpm db:seed:site-app-visual

      - name: Build @apps/${{ matrix.app }}
        run: pnpm --filter "@apps/${{ matrix.app }}" run build
        env:
          NODE_ENV: production

      - name: Smoke and capture @apps/${{ matrix.app }} navigation pages
        run: pnpm --dir apps/optimitron exec tsx ../../scripts/smoke-site-apps.mjs "${{ matrix.app }}"
        env:
          NODE_ENV: production
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
          SITE_APP_SCREENSHOT_ROOT: apps/optimitron/output/playwright/site-app-screenshots

      - name: Upload @apps/${{ matrix.app }} visual screenshots
        uses: actions/upload-artifact@v6
        with:
          name: site-app-visual-${{ matrix.app }}
          path: apps/optimitron/output/playwright/site-app-screenshots
          if-no-files-found: error

  site-apps-validate:
    name: site-apps-validate
    if: ${{ always() }}
    needs: [changes, site-apps-static-validate, site-apps-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify site-app validation results
        env:
          SITE_APPS_CHANGED: ${{ needs.changes.outputs.site_apps }}
          STATIC_RESULT: ${{ needs.site-apps-static-validate.result }}
          BUILD_RESULT: ${{ needs.site-apps-build.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SITE_APPS_CHANGED" != "true" ]; then
            echo "No site-app changes; validation was skipped."
            exit 0
          fi
          test "$STATIC_RESULT" = "success" || {
            echo "::error::Site-app static validation result: $STATIC_RESULT"
            exit 1
          }
          test "$BUILD_RESULT" = "success" || {
            echo "::error::Site-app build matrix result: $BUILD_RESULT"
            exit 1
          }
          echo "All site-app static, build, and smoke checks passed."

  web-static-validate:
    name: web-static-validate
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      # Must match vitest.config.ts hardcoded DATABASE_URL exactly. The hardcode
      # is a safety guard against `pnpm test` accidentally hitting prod when a
      # developer has the prod DATABASE_URL in their local env.
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      NEXTAUTH_SECRET: test-secret-minimum-32-characters-long-for-validation
      NEXTAUTH_URL: http://127.0.0.1:3001
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@8.14.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run GitHub automation script tests
        run: node --test .github/scripts/generate-pr-preview-links.test.mjs .github/scripts/preview-managed-data-filter.test.mjs .github/scripts/preview-smoke-scope.test.mjs .github/scripts/preview-neon-branch.test.mjs .github/scripts/preview-masking-workflow-order.test.mjs .github/scripts/preview-masking-demo-user.test.mjs .github/scripts/preview-masking-managed-triggers.test.mjs .github/scripts/preview-masking-private-execution.test.mjs .github/scripts/preview-deploy-smoke.test.mjs .github/scripts/smoke-deploy-demo-login.test.mjs

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Build web workspace dependencies
        run: pnpm --filter @optimitron/web run build:workspace-deps

      - name: Typecheck web app
        run: pnpm --filter @optimitron/web run typecheck:fast
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Lint web app
        # The web package was previously never linted in CI (core-validate
        # filters it out with '!@optimitron/web'), so ESLint errors such as
        # react/no-unescaped-entities rode through green CI. Gate on them here.
        run: pnpm --filter @optimitron/web run lint

      - name: Run web unit tests
        run: pnpm --filter @optimitron/web run test

  web-e2e-validate:
    name: web-e2e-validate
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      # peaceiris/actions-gh-pages needs write to push the visual review to
      # the long-lived `gh-pages` branch.
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    env:
      CI: true
      # Must match vitest.config.ts hardcoded DATABASE_URL exactly for safety.
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      NEXTAUTH_SECRET: test-secret-minimum-32-characters-long-for-validation
      NEXTAUTH_URL: http://127.0.0.1:3001
      VERCEL_CLI_VERSION: 50.37.3
      PLAYWRIGHT_BROWSER_CHANNEL: chrome
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Skip web e2e validation
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') != true }}
        shell: bash
        run: echo "No web-impacting files changed; skipping Playwright install, smoke validation, and visual review."

      - name: Checkout
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enable Corepack
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        run: |
          corepack enable
          corepack prepare pnpm@8.14.0 --activate

      - name: Setup Node.js
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        uses: actions/cache@v4
        with:
          path: apps/optimitron/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/optimitron/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Apply database migrations
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        run: pnpm db:deploy

      - name: Build web workspace dependencies
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        run: pnpm --filter @optimitron/web run build:workspace-deps

      - name: Build web app
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm --filter @optimitron/web run build:fast

      - name: Verify system Chrome
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        run: google-chrome --version

      - name: Install Playwright system deps
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        run: pnpm --filter @optimitron/web exec playwright install-deps chromium

      - name: Sync managed data (idempotent upserts; matches production)
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        # Single source of truth for production-worthy bootstrap/reference data,
        # campaign records, and task triggers used by post-signin flows.
        run: pnpm db:sync:managed-data -- --apply

      - name: Run Playwright smoke validation
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        run: pnpm --filter @optimitron/web run e2e -- smoke

      - name: Run Playwright visual review
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        id: visual_regression
        run: pnpm --filter @optimitron/web run e2e -- visual

      - name: Upload PR visual screenshots for review publishing
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true && github.event_name == 'pull_request' && steps.visual_regression.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: web-pr-visual-screenshots
          path: apps/optimitron/screenshots
          if-no-files-found: error

      - name: Upload PR markdown copy snapshots for review publishing
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true && github.event_name == 'pull_request' && steps.visual_regression.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: web-pr-copy-snapshots
          path: apps/optimitron/output/playwright/copy-snapshots
          if-no-files-found: error

      - name: Build visual review index
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true && github.event_name != 'pull_request' }}
        env:
          VISUAL_REVIEW_COMMIT_SHA: ${{ github.sha }}
          VISUAL_REVIEW_BASE_URL: ""
          VISUAL_REVIEW_PR_NUMBER: ""
          VISUAL_REVIEW_HEAD_BRANCH: ${{ github.ref_name }}
          VISUAL_REVIEW_REPO: ${{ github.repository }}
          VISUAL_COPY_AFTER_ROOT: ${{ github.workspace }}/apps/optimitron/output/playwright/copy-snapshots
          VISUAL_REVIEW_ALLOW_INCOMPLETE: "1"
        run: pnpm --filter @optimitron/web run visual:review

      - name: Summarize visual review
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          {
            echo "## Visual review"
            echo
            echo "- Open the \`web-visual-review\` artifact from this run."
            echo "- Start with \`apps/optimitron/output/playwright/review/latest.html\` for the compact before/after screenshot gallery."
            echo "- Use the generated gallery for before/after diffs and changed-only review."
            echo "- Captured routes are defined in \`apps/optimitron/e2e/visual-regression.spec.ts\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright visual review
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v6
        with:
          name: web-visual-review
          path: |
            apps/optimitron/output/playwright/review
            apps/optimitron/output/playwright/copy-snapshots
            apps/optimitron/screenshots
            apps/optimitron/playwright-report
            apps/optimitron/test-results
          if-no-files-found: ignore

      - name: Upload Playwright artifacts
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true && failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: web-playwright-artifacts
          path: |
            apps/optimitron/playwright-report
            apps/optimitron/screenshots
            apps/optimitron/public/img/screenshots
            apps/optimitron/test-results
          if-no-files-found: ignore

  main-visual-baseline:
    name: main-visual-baseline
    if: ${{ always() && github.event_name != 'pull_request' && needs.web-e2e-validate.result == 'success' && needs.site-apps-build.result == 'success' }}
    needs:
      - site-apps-build
      - web-e2e-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download web visual baseline
        uses: actions/download-artifact@v6
        with:
          name: web-visual-review
          path: apps/optimitron/output/playwright/main-visual-baseline

      - name: Add site-app screenshots to main baseline
        uses: actions/download-artifact@v6
        with:
          pattern: site-app-visual-*
          path: apps/optimitron/output/playwright/main-visual-baseline/screenshots
          merge-multiple: true

      - name: Upload complete main visual baseline
        uses: actions/upload-artifact@v6
        with:
          name: main-visual-baseline
          path: apps/optimitron/output/playwright/main-visual-baseline
          if-no-files-found: error

  web-visual-review:
    name: web-visual-review
    if: ${{ always() && github.event_name == 'pull_request' && (fromJSON(needs.changes.outputs.web || 'false') == true || fromJSON(needs.changes.outputs.site_apps || 'false') == true) && needs.web-e2e-validate.result == 'success' && (fromJSON(needs.changes.outputs.site_apps || 'false') != true || needs.site-apps-build.result == 'success') }}
    needs:
      - changes
      - site-apps-build
      - web-e2e-validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Every run of this job force-pushes the gh-pages branch. Two PRs
    # publishing at once would both read the same starting state, both add
    # their own directory, and the second push would drop the first. Serialise
    # publishes repo-wide and queue rather than cancel, so no PR loses its
    # review page to a concurrent run.
    #
    # `queue: max` is load-bearing, not decoration. The default `queue: single`
    # allows exactly one pending member and cancels it when a newer one
    # arrives, so a burst of three PRs would cancel the middle one outright —
    # worse than the bug this job is fixing, because the canceled run never
    # publishes at all and leaves a canceled check on the PR. `max` holds up
    # to 100 waiters in FIFO order. It may not be combined with
    # `cancel-in-progress: true`; `false` is what we want anyway.
    concurrency:
      group: visual-review-gh-pages
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: write
      deployments: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Copy diffs need the merge-base with origin/main. A blobless clone
          # keeps that history without downloading every historical asset.
          fetch-depth: 0
          filter: blob:none

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@8.14.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download PR visual screenshots
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        uses: actions/download-artifact@v6
        with:
          name: web-pr-visual-screenshots
          path: apps/optimitron/screenshots

      - name: Download site-app visual screenshots
        if: ${{ fromJSON(needs.changes.outputs.site_apps || 'false') == true }}
        uses: actions/download-artifact@v6
        with:
          pattern: site-app-visual-*
          path: apps/optimitron/screenshots
          merge-multiple: true

      - name: Download PR markdown copy snapshots
        if: ${{ fromJSON(needs.changes.outputs.web || 'false') == true }}
        uses: actions/download-artifact@v6
        with:
          name: web-pr-copy-snapshots
          path: apps/optimitron/output/playwright/copy-after

      - name: Preserve PR visual screenshots
        shell: bash
        run: |
          rm -rf apps/optimitron/output/playwright/pr-screenshots
          mkdir -p apps/optimitron/output/playwright
          cp -R apps/optimitron/screenshots apps/optimitron/output/playwright/pr-screenshots

      - name: Resolve main visual baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          baseline_root="apps/optimitron/output/playwright/main-baseline"
          pr_screenshots="apps/optimitron/output/playwright/pr-screenshots"
          base_sha="${{ github.event.pull_request.base.sha }}"
          rm -rf "$baseline_root"
          mkdir -p "$baseline_root"

          # Prefer the artifact produced for this PR's exact base commit. The
          # overall workflow may still be red because production deployment
          # failed after web-e2e-validate successfully uploaded its artifact.
          exact_run_candidates="$(
            gh run list \
              --workflow CI \
              --branch main \
              --commit "$base_sha" \
              --limit 5 \
              --json databaseId,headSha \
              --jq '.[] | "\(.databaseId)\t\(.headSha)"'
          )"
          fallback_run_candidates="$(
            gh run list \
              --workflow CI \
              --branch main \
              --limit 20 \
              --json databaseId,headSha \
              --jq '.[] | "\(.databaseId)\t\(.headSha)"'
          )"
          run_candidates_output="$(
            printf '%s\n%s\n' "$exact_run_candidates" "$fallback_run_candidates" |
              awk -F '\t' 'NF && !seen[$1]++'
          )"
          run_candidates=()
          if [ -n "$run_candidates_output" ]; then
            mapfile -t run_candidates <<< "$run_candidates_output"
          fi

          for candidate in "${run_candidates[@]}"; do
            IFS=$'\t' read -r run_id baseline_sha <<< "$candidate"
            run_root="$baseline_root/run-$run_id"
            for artifact_name in main-visual-baseline web-visual-review; do
              rm -rf "$run_root"
              mkdir -p "$run_root"

              if ! gh run download "$run_id" \
                --name "$artifact_name" \
                --dir "$run_root" >/dev/null 2>&1; then
                continue
              fi

              for screenshots_dir in "$run_root/screenshots" "$run_root/apps/optimitron/screenshots"; do
                if [ -d "$screenshots_dir" ]; then
                  echo "VISUAL_BEFORE_ROOT=$GITHUB_WORKSPACE/$screenshots_dir" >> "$GITHUB_ENV"
                  echo "VISUAL_REVIEW_BASELINE_COMMIT_SHA=$baseline_sha" >> "$GITHUB_ENV"
                  echo "VISUAL_REVIEW_REQUESTED_BASE_COMMIT_SHA=$base_sha" >> "$GITHUB_ENV"
                  echo "VISUAL_REVIEW_BASELINE_RUN_ID=$run_id" >> "$GITHUB_ENV"
                  for copy_dir in \
                    "$run_root/copy-snapshots" \
                    "$run_root/output/playwright/copy-snapshots" \
                    "$run_root/apps/optimitron/output/playwright/copy-snapshots"; do
                    if [ -d "$copy_dir" ]; then
                      echo "VISUAL_COPY_BEFORE_ROOT=$GITHUB_WORKSPACE/$copy_dir" >> "$GITHUB_ENV"
                      echo "Using rendered copy baseline from main run $run_id."
                      break
                    fi
                  done
                  echo "Downloaded $artifact_name main@$baseline_sha from run $run_id (requested main@$base_sha)."
                  rm -rf apps/optimitron/screenshots
                  cp -R "$pr_screenshots" apps/optimitron/screenshots
                  exit 0
                fi
              done
            done

            rm -rf "$run_root"
          done

          echo "No usable main web-visual-review artifact found; visual review will show after screenshots only."
          rm -rf apps/optimitron/screenshots
          cp -R "$pr_screenshots" apps/optimitron/screenshots

      - name: Resolve PR preview URL
        id: pr_preview_url
        uses: actions/github-script@v8
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const ref = context.payload.pull_request.head.sha;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner,
              repo,
              ref,
              per_page: 100,
            });

            for (const deployment of deployments) {
              const env = deployment.environment || '';
              if (env.startsWith('visual-review')) continue;

              const statuses = await github.rest.repos.listDeploymentStatuses({
                owner,
                repo,
                deployment_id: deployment.id,
                per_page: 20,
              });
              const ready = statuses.data.find((status) =>
                status.state === 'success' &&
                status.environment_url &&
                /^https?:\/\//.test(status.environment_url)
              );
              if (ready) {
                return ready.environment_url;
              }
            }

            return '';

      - name: Post PR review packet preview links
        if: ${{ !cancelled() && steps.pr_preview_url.outputs.result != '' }}
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.pr_preview_url.outputs.result }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: issue_number, per_page: 100,
            });
            const changed = files
              .filter((f) => f.status !== 'removed')
              .map((f) => f.filename);

            const packetMarker = '<!-- pr-review-packet -->';
            const legacyMarker = '<!-- pr-preview-links -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = [...comments].reverse().find((c) =>
              c.body && (c.body.includes(packetMarker) || c.body.includes(legacyMarker))
            );
            const stdout = execFileSync(
              process.execPath,
              ['.github/scripts/generate-pr-preview-links.mjs'],
              {
                env: {
                  ...process.env,
                  CHANGED_FILES: JSON.stringify(changed),
                  EXISTING_COMMENT_BODY: existing?.body ?? '',
                },
                encoding: 'utf8',
              },
            );
            const body = stdout.trim();
            if (!body) return;

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      - name: Build visual review index
        if: always()
        env:
          VISUAL_REVIEW_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          VISUAL_REVIEW_BASE_URL: ${{ steps.pr_preview_url.outputs.result }}
          VISUAL_REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          VISUAL_REVIEW_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          VISUAL_REVIEW_REPO: ${{ github.repository }}
          VISUAL_COPY_AFTER_ROOT: ${{ github.workspace }}/apps/optimitron/output/playwright/copy-after
        run: pnpm --filter @optimitron/web run visual:review

      - name: Summarize visual review
        if: always()
        shell: bash
        run: |
          {
            echo "## Visual review"
            echo
            echo "- Open the \`web-visual-review\` artifact from this run."
            echo "- Start with \`apps/optimitron/output/playwright/review/latest.html\` for the compact before/after screenshot gallery."
            echo "- Use the generated gallery for before/after diffs and changed-only review."
            echo "- Captured routes are defined in \`apps/optimitron/e2e/visual-regression.spec.ts\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright visual review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-visual-review
          path: |
            apps/optimitron/output/playwright/review
            apps/optimitron/output/playwright/copy-after
            apps/optimitron/screenshots
            apps/optimitron/playwright-report
            apps/optimitron/test-results
          if-no-files-found: ignore

      - name: Prepare per-PR visual review directory
        id: prepare_pages
        shell: bash
        run: |
          head_sha="${{ github.event.pull_request.head.sha }}"
          short_sha="${head_sha:0:12}"
          pr_root="apps/optimitron/output/playwright/pages-per-pr/pr-${{ github.event.pull_request.number }}"
          commit_dir="$pr_root/$short_sha"
          latest_dir="$pr_root/latest"
          rm -rf "$pr_root"
          mkdir -p "$commit_dir" "$latest_dir"
          cp -R apps/optimitron/output/playwright/review/. "$commit_dir/"
          cp -R apps/optimitron/output/playwright/review/. "$latest_dir/"
          if [ -f "$commit_dir/latest.html" ]; then
            cp "$commit_dir/latest.html" "$commit_dir/index.html"
          fi
          if [ -f "$latest_dir/latest.html" ]; then
            cp "$latest_dir/latest.html" "$latest_dir/index.html"
          fi
          publish_root="apps/optimitron/output/playwright/pages-per-pr"
          touch "$publish_root/.nojekyll"
          # Vercel reads vercel.json from the DEPLOYED commit's tree, so the
          # repo's gh-pages:false rule never applies to the gh-pages branch
          # itself (it only contains these screenshots). Publish a
          # deployment kill-switch into the branch at both paths Vercel
          # might resolve (repo root and the project's apps/optimitron root)
          # so every visual-review push stops producing a failed Vercel
          # deploy + failure email.
          echo '{"git":{"deploymentEnabled":false},"github":{"enabled":false}}' > "$publish_root/vercel.json"
          mkdir -p "$publish_root/apps/optimitron"
          echo '{"git":{"deploymentEnabled":false},"github":{"enabled":false}}' > "$publish_root/apps/optimitron/vercel.json"
          cat > "$publish_root/index.html" <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Optimitron Visual Reviews</title>
            </head>
            <body>
              <h1>Optimitron Visual Reviews</h1>
              <p>Open the "Visual review" check on a pull request for its review page.</p>
            </body>
          </html>
          HTML
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "publish_dir=apps/optimitron/output/playwright/pages-per-pr" >> "$GITHUB_OUTPUT"
          echo "review_url=https://mikepsinn.github.io/optimitron/pr-${{ github.event.pull_request.number }}/$short_sha/" >> "$GITHUB_OUTPUT"
          echo "latest_review_url=https://mikepsinn.github.io/optimitron/pr-${{ github.event.pull_request.number }}/latest/" >> "$GITHUB_OUTPUT"

      - name: Post Visual review pending status
        if: ${{ !cancelled() && steps.prepare_pages.outcome == 'success' }}
        uses: actions/github-script@v8
        env:
          VISUAL_REVIEW_URL: ${{ steps.prepare_pages.outputs.review_url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = context.payload.pull_request.head.sha;
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: headSha,
              state: 'pending',
              context: 'Visual review',
              description: 'Publishing screenshot review',
              target_url: process.env.VISUAL_REVIEW_URL,
            });

      - name: Carry forward open PRs' review pages, prune closed ones
        # force_orphan below replaces the whole branch with one commit, which
        # keeps screenshot binaries out of git history but also deletes every
        # other PR's review directory. Before 2026-07-26 that left exactly one
        # PR live at a time: three of four open PRs 404'd while their "Visual
        # review" check still said SUCCESS, because each publish had genuinely
        # succeeded and was then overwritten minutes later by the next one.
        #
        # Re-materialise existing pr-* directories into the publish dir so the
        # orphan commit contains them too — but only for PRs that are still
        # OPEN. Because every publish rebuilds the branch from scratch,
        # pruning is simply declining to carry a directory forward: merged and
        # closed PRs' pages drop off on the next publish with no separate
        # cleanup job. The current PR is also not carried forward. Its fresh
        # directory already exists in the publish root, and replacing its old
        # revisions prevents stale or sensitive screenshots from living at
        # permanent historical URLs.
        #
        # Fail-open on the API check: if the PR-state lookup errors, carry the
        # directory anyway. Keeping a stale page beats deleting a live one.
        #
        # The `|| true` on each cp is required, not sloppiness. Since coreutils
        # 9.2 `cp -n` exits non-zero whenever it skips a file, and 9.5 also
        # prints a diagnostic per skip. ubuntu-latest ships 9.4. Skipping is
        # the normal case here — this PR's own directory already exists in
        # gh-pages from its previous run — so under `set -e` a bare cp would
        # fail the step on every re-push and block the publish entirely.
        shell: bash
        env:
          CURRENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          publish_root="${{ steps.prepare_pages.outputs.publish_dir }}"
          # "gh-pages does not exist yet" and "the lookup failed" both make
          # git exit non-zero, but only the first is safe to continue from.
          # Treating a transient network or GitHub error as an absent branch
          # would let the force_orphan publish below run with nothing carried
          # forward, deleting every other PR's page — the exact bug this step
          # exists to prevent. `ls-remote --exit-code` separates the two: 2
          # means no matching ref, anything else non-zero is a real failure.
          ls_remote_status=0
          git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1 \
            || ls_remote_status=$?
          if [ "$ls_remote_status" -eq 2 ]; then
            echo "No gh-pages branch yet; publishing this PR's review only."
            exit 0
          fi
          if [ "$ls_remote_status" -ne 0 ]; then
            echo "::error::Could not determine whether gh-pages exists (git ls-remote exit $ls_remote_status). Failing before the force_orphan publish rather than wiping other PRs' review pages."
            exit 1
          fi
          # Bare, so set -e fails the step on a fetch error. A failed step
          # skips the publish and leaves gh-pages untouched.
          git fetch --depth=1 origin gh-pages
          staging="$(mktemp -d)"
          git archive FETCH_HEAD | tar -x -C "$staging"
          carried=0
          pruned=0
          for existing in "$staging"/pr-*; do
            [ -d "$existing" ] || continue
            dir_name="$(basename "$existing")"
            pr_number="${dir_name#pr-}"
            case "$pr_number" in
              ''|*[!0-9]*)
                # Not a pr-<number> directory; carry it untouched.
                cp -Rn "$existing" "$publish_root/" 2>/dev/null || true
                continue
                ;;
            esac
            if [ "$pr_number" = "$CURRENT_PR_NUMBER" ]; then
              echo "Replacing $dir_name with this run's sanitized review."
              continue
            fi
            state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq .state 2>/dev/null || echo unknown)"
            if [ "$state" = "closed" ]; then
              pruned=$((pruned + 1))
              echo "Pruning $dir_name (PR is closed)."
              continue
            fi
            cp -Rn "$existing" "$publish_root/" 2>/dev/null || true
            carried=$((carried + 1))
          done
          rm -rf "$staging"
          echo "Carried forward $carried open PR page(s); pruned $pruned closed."

      - name: Publish visual review to gh-pages
        id: visual_review_pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.prepare_pages.outputs.publish_dir }}
          publish_branch: gh-pages
          keep_files: false
          force_orphan: true
          enable_jekyll: false
          commit_message: "Visual review for pr-${{ github.event.pull_request.number }}@${{ steps.prepare_pages.outputs.short_sha }}"
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      - name: Wait for visual review page
        id: wait_visual_review_pages
        if: ${{ !cancelled() && steps.visual_review_pages.outcome == 'success' }}
        shell: bash
        run: |
          target_url="${{ steps.prepare_pages.outputs.review_url }}"
          expected_sha="${{ steps.prepare_pages.outputs.short_sha }}"
          echo "target_url=$target_url" >> "$GITHUB_OUTPUT"
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "Waiting for $target_url to show commit $expected_sha"
          max_attempts=180
          for attempt in $(seq 1 "$max_attempts"); do
            status="$(curl -L -sS --connect-timeout 3 --max-time 4 -o /tmp/visual-review-latest.html -w "%{http_code}" "$target_url" || true)"
            if [ "$status" = "200" ] && [ -s /tmp/visual-review-latest.html ]; then
              if grep -q "$expected_sha" /tmp/visual-review-latest.html; then
                echo "available=true" >> "$GITHUB_OUTPUT"
                echo "Visual review page is live for commit $expected_sha after attempt $attempt."
                exit 0
              fi
              echo "Attempt $attempt/$max_attempts returned HTTP 200, but commit $expected_sha is not visible yet; retrying in 10s."
            else
              echo "Attempt $attempt/$max_attempts returned HTTP $status; retrying in 10s."
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep 10
            fi
          done
          echo "::error::Visual review page did not become available before the wait limit: $target_url"
          echo "The review artifact was uploaded and the gh-pages publish step completed, but the public GitHub Pages URL stayed unavailable."

      - name: Post Visual review commit status
        if: ${{ always() && steps.prepare_pages.outcome == 'success' && !cancelled() }}
        uses: actions/github-script@v8
        env:
          VISUAL_REVIEW_AVAILABLE: ${{ steps.wait_visual_review_pages.outputs.available }}
          VISUAL_REVIEW_PUBLISH_OUTCOME: ${{ steps.visual_review_pages.outcome }}
          VISUAL_REVIEW_URL: ${{ steps.wait_visual_review_pages.outputs.target_url || steps.prepare_pages.outputs.review_url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = context.payload.pull_request.head.sha;
            const shortSha = headSha.slice(0, 12);
            const available = process.env.VISUAL_REVIEW_AVAILABLE === 'true';
            const publishOutcome = process.env.VISUAL_REVIEW_PUBLISH_OUTCOME || 'unknown';
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: headSha,
              state: available ? 'success' : 'failure',
              context: 'Visual review',
              description: available
                ? `Ready · ${shortSha}`
                : `Not live after Pages wait (${publishOutcome})`,
              target_url: process.env.VISUAL_REVIEW_URL,
            });

      - name: Fail if visual review page is unavailable
        if: ${{ !cancelled() && steps.prepare_pages.outcome == 'success' && steps.wait_visual_review_pages.outputs.available != 'true' }}
        run: exit 1

      - name: Update PR review packet with visual review
        if: ${{ !cancelled() && steps.wait_visual_review_pages.outputs.available == 'true' && steps.pr_preview_url.outputs.result != '' }}
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.pr_preview_url.outputs.result }}
          VISUAL_REVIEW_URL: ${{ steps.prepare_pages.outputs.latest_review_url }}
          VISUAL_REVIEW_MANIFEST_PATH: apps/optimitron/output/playwright/review/manifest.json
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: issue_number, per_page: 100,
            });
            const changed = files
              .filter((f) => f.status !== 'removed')
              .map((f) => f.filename);

            const packetMarker = '<!-- pr-review-packet -->';
            const legacyMarker = '<!-- pr-preview-links -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = [...comments].reverse().find((c) =>
              c.body && (c.body.includes(packetMarker) || c.body.includes(legacyMarker))
            );

            const stdout = execFileSync(
              process.execPath,
              ['.github/scripts/generate-pr-preview-links.mjs'],
              {
                env: {
                  ...process.env,
                  CHANGED_FILES: JSON.stringify(changed),
                  EXISTING_COMMENT_BODY: existing?.body ?? '',
                  VISUAL_REVIEW_URL: process.env.VISUAL_REVIEW_URL,
                },
                encoding: 'utf8',
              },
            );
            const body = stdout.trim();
            if (!body) return;

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  web-validate:
    name: web-validate
    if: always() && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    needs:
      - web-static-validate
      - web-e2e-validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify web validation lanes passed
        shell: bash
        run: |
          static_result="${{ needs.web-static-validate.result }}"
          e2e_result="${{ needs.web-e2e-validate.result }}"
          echo "web-static-validate: $static_result"
          echo "web-e2e-validate: $e2e_result"
          if [ "$static_result" != "success" ] || [ "$e2e_result" != "success" ]; then
            exit 1
          fi

  sync-preview-managed-data:
    name: sync-preview-managed-data
    if: github.event_name == 'pull_request'
    needs: web-validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Preview
    permissions:
      contents: read
      pull-requests: read
    env:
      CI: true
      PREVIEW_GIT_BRANCH: ${{ github.head_ref }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME }}
      NEON_ROLE_NAME: ${{ vars.NEON_ROLE_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Detect preview database sync changes
        id: preview_data_changes
        uses: actions/github-script@v8
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const filter = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/preview-managed-data-filter.mjs`).href
            );
            const previewScope = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/preview-smoke-scope.mjs`).href
            );
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const filenames = files.map((file) => file.filename);
            const matches = filter.getPreviewManagedDataSyncMatches(filenames);
            const medicalMatches = filter.getPreviewMedicalReferenceSyncMatches(filenames);
            const previewBuildMatches = previewScope.getVercelPreviewBuildMatches(filenames);
            const shouldPrepare = previewBuildMatches.length > 0;
            const shouldSync = shouldPrepare && matches.length > 0;
            const skipMedicalReference = shouldSync && medicalMatches.length === 0;
            core.setOutput('should_sync', shouldSync ? 'true' : 'false');
            core.setOutput('should_prepare', shouldPrepare ? 'true' : 'false');
            core.setOutput('matched_files', matches.join('\n'));
            core.setOutput('medical_reference_files', medicalMatches.join('\n'));
            core.setOutput('preview_build_files', previewBuildMatches.join('\n'));
            core.setOutput('skip_medical_reference', skipMedicalReference ? '1' : '0');
            core.setOutput('changed_file_count', String(filenames.length));
            if (!shouldPrepare) {
              await core.summary
                .addHeading('Preview database sync')
                .addRaw(`Database preparation skipped: none of the ${filenames.length} changed file(s) are in the Vercel preview build scope.`)
                .write();
            }

      # Every Vercel preview gets the branch-head schema before masking.
      # Managed-data sync remains conditional.
      - name: Check Preview database sync configuration
        if: steps.preview_data_changes.outputs.should_prepare == 'true'
        id: preview_secrets
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        shell: bash
        run: |
          if [ -n "$NEON_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          if [ "$IS_FORK" = "true" ]; then
            echo "::warning::Preview database preparation is unavailable to fork pull requests because repository secrets are not exposed."
            {
              echo "## Preview database sync"
              echo
              echo "Skipped for a fork pull request because repository secrets are not exposed. Do not treat a fork preview database as anonymized or schema-ready."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::Preview database preparation is blocked: the GitHub Preview environment is missing NEON_API_KEY."
          {
            echo "## Preview database sync"
            echo
            echo "Blocked: GitHub Preview environment is missing required configuration."
            echo "- Missing \`NEON_API_KEY\`."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Enable Corepack
        if: steps.preview_data_changes.outputs.should_prepare == 'true' && steps.preview_secrets.outputs.configured == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@8.14.0 --activate

      - name: Setup Node.js
        if: steps.preview_data_changes.outputs.should_prepare == 'true' && steps.preview_secrets.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Resolve preview Neon database env
        if: steps.preview_data_changes.outputs.should_prepare == 'true' && steps.preview_secrets.outputs.configured == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node .github/scripts/resolve-preview-neon-env.mjs

      - name: Install dependencies
        if: steps.preview_data_changes.outputs.should_prepare == 'true' && steps.preview_secrets.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      # Neon computes scale to zero, and a preview branch created moments ago
      # can still be booting its endpoint. Resolving the branch succeeds while
      # the first real connection fails with P1001, which fails this job and
      # cascades into every downstream preview smoke check. Poll until the
      # endpoint answers a query before touching it.
      - name: Wait for preview database to accept connections
        if: steps.preview_data_changes.outputs.should_prepare == 'true' && steps.preview_secrets.outputs.configured == 'true'
        timeout-minutes: 6
        shell: bash
        run: |
          set -uo pipefail
          database_url="${DATABASE_URL_UNPOOLED:-}"
          if [ -z "$database_url" ]; then
            echo "::error::DATABASE_URL_UNPOOLED is missing from the resolved Neon preview database env."
            exit 1
          fi
          echo "::add-mask::$database_url"

          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

          # Bound every attempt: libpq waits indefinitely by default, so a host
          # that stalls mid-TLS would consume the whole step timeout and this
          # loop would never retry or reach its deadline. PGCONNECT_TIMEOUT
          # covers the connect phase; `timeout` is the hard ceiling for a probe
          # that stalls after connecting.
          export PGCONNECT_TIMEOUT=10
          deadline=$(( SECONDS + 300 ))
          attempt=0
          until timeout 15 psql "$database_url" --set ON_ERROR_STOP=1 -qtAc 'select 1' >/dev/null 2>&1; do
            attempt=$(( attempt + 1 ))
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Preview database did not accept a connection within 300s (${attempt} attempts). The Neon endpoint may be failing to start."
              exit 1
            fi
            echo "Preview database not ready yet (attempt ${attempt}); retrying in 5s."
            sleep 5
          done
          echo "Preview database accepted a connection after ${attempt} retry attempt(s)."

      - name: Apply preview database migrations
        if: steps.preview_data_changes.outputs.should_prepare == 'true' && steps.preview_secrets.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL_UNPOOLED:-}" ]; then
            echo "::error::DATABASE_URL_UNPOOLED is missing from the resolved Neon preview database env."
            exit 1
          fi
          DATABASE_URL="$DATABASE_URL_UNPOOLED" pnpm db:deploy

      - name: Apply preview database anonymization
        if: steps.preview_data_changes.outputs.should_prepare == 'true' && steps.preview_secrets.outputs.configured == 'true'
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail

          database_url="${DATABASE_URL_UNPOOLED:-}"
          if [ -z "$database_url" ]; then
            echo "::error::DATABASE_URL_UNPOOLED is missing from the resolved Neon preview database env."
            exit 1
          fi

          echo "::add-mask::$database_url"

          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

          psql "$database_url" --set ON_ERROR_STOP=1 --file packages/db/prisma/anonymization-setup.sql
          psql "$database_url" --set ON_ERROR_STOP=1 --file packages/db/prisma/anonymization-updates.sql

      - name: Sync preview managed data
        if: steps.preview_data_changes.outputs.should_sync == 'true' && steps.preview_secrets.outputs.configured == 'true'
        env:
          MANAGED_DATA_ALLOW_REMOTE_APPLY: "1"
          MANAGED_DATA_SKIP_MEDICAL_REFERENCE: ${{ steps.preview_data_changes.outputs.skip_medical_reference }}
        run: pnpm db:sync:managed-data -- --apply

      - name: Re-apply preview database anonymization after managed data
        if: steps.preview_data_changes.outputs.should_sync == 'true' && steps.preview_secrets.outputs.configured == 'true'
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail

          database_url="${DATABASE_URL_UNPOOLED:-}"
          if [ -z "$database_url" ]; then
            echo "::error::DATABASE_URL_UNPOOLED is missing from the resolved Neon preview database env."
            exit 1
          fi

          echo "::add-mask::$database_url"

          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

          psql "$database_url" --set ON_ERROR_STOP=1 --file packages/db/prisma/anonymization-setup.sql
          psql "$database_url" --set ON_ERROR_STOP=1 --file packages/db/prisma/anonymization-updates.sql

      - name: Verify preview masking applied to rows
        if: steps.preview_data_changes.outputs.should_prepare == 'true' && steps.preview_secrets.outputs.configured == 'true'
        shell: bash
        run: node apps/optimitron/scripts/verify-preview-masking.mjs

      - name: Summarize preview database sync
        if: steps.preview_data_changes.outputs.should_prepare == 'true' && steps.preview_secrets.outputs.configured == 'true'
        env:
          MANAGED_DATA_SKIP_MEDICAL_REFERENCE: ${{ steps.preview_data_changes.outputs.skip_medical_reference }}
          SHOULD_SYNC: ${{ steps.preview_data_changes.outputs.should_sync }}
        shell: bash
        run: |
          {
            echo "## Preview database sync"
            echo
            echo "- Resolved Neon preview database env for \`$PREVIEW_GIT_BRANCH\`."
            echo "- Applied Prisma migrations to the branch preview database."
            echo "- Applied preview anonymization setup and direct SQL masking updates."
            if [ "$SHOULD_SYNC" = "true" ]; then
              echo "- Synced managed data with idempotent upserts."
              echo "- Re-applied preview anonymization after managed-data sync."
              if [ "$MANAGED_DATA_SKIP_MEDICAL_REFERENCE" = "1" ]; then
                echo "- Skipped medical reference rows because no medical dataset or seed-data files changed; disposable CI still runs the full local sync."
              fi
            else
              echo "- Managed-data sync was unnecessary for this pull request."
            fi
            echo "- Verified sampled masked row shapes after the final update pass."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: deploy-production
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: web-validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.deployment_url }}
    env:
      VERCEL_CLI_VERSION: 50.37.3
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@8.14.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js production build
        uses: actions/cache@v4
        with:
          path: apps/optimitron/.next/cache
          key: nextjs-production-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/optimitron/src/**', 'apps/optimitron/next.config.js', 'apps/optimitron/package.json') }}
          restore-keys: |
            nextjs-production-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-production-${{ runner.os }}-
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Verify Vercel configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing GitHub secret VERCEL_TOKEN"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing GitHub variable VERCEL_ORG_ID"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing GitHub variable VERCEL_PROJECT_ID"; exit 1; }

          project_json="$(mktemp)"
          status="$(
            curl --silent --show-error \
              --output "$project_json" \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"
          )"

          case "$status" in
            200) ;;
            401)
              echo "::error::VERCEL_TOKEN is missing, expired, or invalid for Vercel API access."
              exit 1
              ;;
            403)
              echo "::error::VERCEL_TOKEN cannot access Vercel team $VERCEL_ORG_ID. Rotate the GitHub Production VERCEL_TOKEN secret or use a token from that team."
              exit 1
              ;;
            404)
              echo "::error::VERCEL_PROJECT_ID $VERCEL_PROJECT_ID was not found under VERCEL_ORG_ID $VERCEL_ORG_ID. Check the GitHub Production environment variables."
              exit 1
              ;;
            *)
              echo "::error::Vercel project preflight failed with HTTP $status while checking $VERCEL_PROJECT_ID under $VERCEL_ORG_ID."
              exit 1
              ;;
          esac

          root_directory="$(
            node -e '
              const fs = require("node:fs");
              const project = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              process.stdout.write(project.rootDirectory ?? project.settings?.rootDirectory ?? "");
            ' "$project_json"
          )"
          if [ "$root_directory" != "apps/optimitron" ]; then
            updated_project_json="$(mktemp)"
            status="$(
              curl --silent --show-error \
                --output "$updated_project_json" \
                --write-out "%{http_code}" \
                --request PATCH \
                --header "Authorization: Bearer $VERCEL_TOKEN" \
                --header "Content-Type: application/json" \
                --data '{"rootDirectory":"apps/optimitron"}' \
                "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"
            )"
            if [ "$status" != "200" ]; then
              echo "::error::Failed to update the Vercel project root directory (HTTP $status)."
              cat "$updated_project_json"
              exit 1
            fi
            mv "$updated_project_json" "$project_json"
            echo "Updated the Vercel project root directory to apps/optimitron."
          fi

          node - "$project_json" <<'NODE'
          const fs = require("node:fs");
          const [projectJsonPath] = process.argv.slice(2);
          const project = JSON.parse(fs.readFileSync(projectJsonPath, "utf8"));
          const name = project.name || project.projectName || "(unknown)";
          const rootDirectory = project.rootDirectory ?? project.settings?.rootDirectory ?? null;
          if (rootDirectory !== "apps/optimitron") {
            throw new Error(`Vercel project ${name} rootDirectory is ${rootDirectory ?? "(unset)"}, expected apps/optimitron.`);
          }
          fs.mkdirSync(".vercel", { recursive: true });
          fs.writeFileSync(
            ".vercel/project.json",
            `${JSON.stringify(
              {
                orgId: process.env.VERCEL_ORG_ID,
                projectId: process.env.VERCEL_PROJECT_ID,
              },
              null,
              2,
            )}\n`,
          );
          console.log(`Verified Vercel project ${name} and wrote .vercel/project.json for CI.`);
          NODE

      - name: Verify production database configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "Missing production environment secret DATABASE_URL"; exit 1; }

      - name: Pull Vercel production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm dlx vercel@${VERCEL_CLI_VERSION} build --prod --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"

      - name: Apply production database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK: "1"
        run: pnpm db:deploy

      - name: Sync canonical production data (idempotent upserts)
        # Single managed sync for reference data, campaign records, treaty tasks,
        # referendums, demo fixtures, and trigger blueprints.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MANAGED_DATA_ALLOW_REMOTE_APPLY: "1"
        run: pnpm db:sync:managed-data -- --apply

      - name: Deploy production artifact
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(pnpm dlx vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" --yes | tail -n 1 | tr -d '\r')"
          case "$deployment_url" in
            https://*) ;;
            *) deployment_url="https://$deployment_url" ;;
          esac
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
