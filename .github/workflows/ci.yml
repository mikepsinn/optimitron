name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-validate:
    name: core-validate
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@8.14.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Build
        run: pnpm --filter '!@optimitron/web' run build

      - name: Typecheck
        run: pnpm --filter '!@optimitron/web' run typecheck

      - name: Lint
        run: pnpm --filter '!@optimitron/web' run lint

      - name: Test
        run: pnpm --filter '!@optimitron/web' run test

  web-validate:
    name: web-validate
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/optimitron_web_ci
      NEXTAUTH_SECRET: test-secret-minimum-32-characters-long-for-validation
      NEXTAUTH_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3001
      VERCEL_CLI_VERSION: 50.37.3
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: optimitron_web_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d optimitron_web_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@8.14.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: packages/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/web/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Build web workspace dependencies
        run: pnpm --filter @optimitron/web run build:workspace-deps

      - name: Typecheck web app
        run: pnpm --filter @optimitron/web run typecheck:fast

      - name: Run web unit tests
        run: pnpm --filter @optimitron/web run test

      - name: Build web app
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm --filter @optimitron/web run build:fast

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/web/package.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @optimitron/web exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @optimitron/web exec playwright install-deps chromium

      - name: Run Playwright smoke validation
        run: pnpm --filter @optimitron/web run e2e -- smoke

      - name: Seed visual review data
        run: pnpm --filter @optimitron/db run seed:bootstrap

      - name: Run Playwright visual review
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
          ARGOS_IGNORE_UPLOAD_FAILURES: ${{ secrets.ARGOS_TOKEN == '' && '1' || '0' }}
        run: pnpm --filter @optimitron/web run e2e -- visual

      - name: Build visual review index
        if: always()
        run: pnpm --filter @optimitron/web run visual:review

      - name: Summarize visual review
        if: always()
        shell: bash
        run: |
          {
            echo "## Visual review"
            echo
            echo "- Open the \`web-visual-review\` artifact from this run."
            echo "- Start with \`packages/web/output/playwright/review/latest.html\` for the compact screenshot gallery."
            echo "- Use the Argos check on the pull request for before/after diffs and changed-only review."
            echo "- Captured routes are defined in \`packages/web/e2e/visual-regression.spec.ts\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright visual review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-visual-review
          path: |
            packages/web/output/playwright/review
            packages/web/screenshots
            packages/web/playwright-report
            packages/web/test-results
          if-no-files-found: ignore

      - name: Comment visual review instructions
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- optimitron-visual-review -->';
            const body = `${marker}
            ## Visual review

            The \`web-visual-review\` artifact contains a compact screenshot gallery at:

            \`packages/web/output/playwright/review/latest.html\`

            Use the Argos check on this pull request for before/after diffs and changed-only review. The downloadable artifact is the manual fallback when Argos is unavailable or you want to inspect every captured route.`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: web-playwright-artifacts
          path: |
            packages/web/playwright-report
            packages/web/public/img/screenshots
          if-no-files-found: ignore

  deploy-production:
    name: deploy-production
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.deployment_url }}
    env:
      VERCEL_CLI_VERSION: 50.37.3
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@8.14.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js production build
        uses: actions/cache@v4
        with:
          path: packages/web/.next/cache
          key: nextjs-production-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/web/src/**', 'packages/web/next.config.js', 'packages/web/package.json') }}
          restore-keys: |
            nextjs-production-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-production-${{ runner.os }}-
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Verify Vercel configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing GitHub secret VERCEL_TOKEN"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing GitHub variable VERCEL_ORG_ID"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing GitHub variable VERCEL_PROJECT_ID"; exit 1; }

      - name: Verify production database configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "Missing production environment secret DATABASE_URL"; exit 1; }

      - name: Pull Vercel production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm dlx vercel@${VERCEL_CLI_VERSION} build --prod --token "$VERCEL_TOKEN"

      - name: Apply production database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK: "1"
        run: pnpm db:deploy

      - name: Seed task triggers (idempotent upsert)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:seed:triggers

      - name: Deploy production artifact
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(pnpm dlx vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --token "$VERCEL_TOKEN" --yes | tail -n 1 | tr -d '\r')"
          case "$deployment_url" in
            https://*) ;;
            *) deployment_url="https://$deployment_url" ;;
          esac
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
