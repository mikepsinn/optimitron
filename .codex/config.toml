model = "gpt-5.5"
model_reasoning_effort = "xhigh"

approval_policy = "never"
sandbox_mode = "workspace-write"
[mcp_servers.optimitron-local]
url = "http://localhost:3001/api/mcp"

[mcp_servers.optimitron-tasks]
args = [
    "--filter",
    "@optimitron/web",
    "exec",
    "tsx",
    "scripts/mcp-task-server.ts",
]
command = "pnpm"

[mcp_servers.optimitron-tasks.env]
MCP_USER_EMAIL = "m@thinkbynumbers.org"
